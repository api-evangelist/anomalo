        in: query
        required: false
        schema:
          type: string
      - name: warehouse_id
        in: query
        required: false
        schema:
          type: integer
      - name: details
        in: query
        required: false
        schema:
          type: boolean
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Successful response. The client returns the decoded JSON body.
