shared_rules:
  authentication: 'X-Anomalo-Token: <api secret token>'
  base_url: https://{instance}/api/public/v1/
  tenancy: >-
    Always read GET /organization before trusting the scope of a result. The active organization is
    sticky server-side state on the API key, not a request parameter.
  idempotency: >-
    Not supported. No idempotency key, no deduplication, no conditional requests. Never blind-retry a
    write.
  retries: >-
    5xx: retry up to 5 attempts with exponential jitter backoff (1s initial, 10s cap). 4xx: never retry;
    the body is opaque text, not a structured error.
  csv_links: >-
    Bad-row and good-row CSV URLs require an authenticated browser session and cannot be fetched
    programmatically. Surface them to the human instead.
  check_outcomes: >-
    A 200 response does not mean healthy. Read check_passed / check_failed / check_errored /
    check_skipped from the payload, and never report an errored check as a data quality failure.
