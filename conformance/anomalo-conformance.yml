  - id: oauth2
    conforms: partial
    evidence: >-
      OAuth 2.0 authorization-code flow is used for USER sign-on to the Anomalo web application,
      advertised at https://app.anomalo.com/.well-known/openid-configuration. It is NOT the API
      authentication mechanism — the Public API uses an `X-Anomalo-Token` API secret token with no
      OAuth flow, no scopes and no token endpoint.
  - id: oidc
    conforms: true
    evidence: >-
      Live OpenID Connect Discovery 1.0 document at
      https://app.anomalo.com/.well-known/openid-configuration (HTTP 200, application/json).
      Declares issuer, authorization/token/userinfo endpoints, RS256 id_token signing, `code` response
      type, and the openid/profile/email scopes.
    caveat: >-
      The advertised `jwks_uri` (https://app.anomalo.com/oauth/.well-known/jwks.json) returns 404 when
      fetched anonymously, so the discovery document is not fully resolvable by an unauthenticated
      relying party.
    detail: scopes/anomalo-scopes.yml
