apis:
  - name: Anomalo Public API
    description: >-
      REST API for the Anomalo data quality platform. Connect and refresh data warehouses, configure
      which tables are monitored, author and run data quality checks, read check-run results and table
      data profiles, manage table and check labels, record table lineage edges, administer users, API
      keys and access groups, and manage notification channels. Deployed per-tenant under
      `https://<instance>/api/public/v1/`; authenticated with an API secret token sent as the
      `X-Anomalo-Token` header (or as an `Authorization: Bearer` token).
    humanURL: https://www.anomalo.com/product-overview/
    baseURL: https://app.anomalo.com/api/public/v1
    tags:
