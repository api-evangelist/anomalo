aid: anomalo
name: Anomalo
description: >-
  Anomalo is an AI-powered data quality and data observability platform that automatically detects,
  alerts on, triages and helps resolve data issues before they reach analytics, reporting or AI models.
  It connects directly to cloud data warehouses and lakehouses — Snowflake, Databricks, BigQuery,
  Redshift, Amazon S3 and others — profiles the tables it monitors, and applies unsupervised machine
  learning to surface anomalies without requiring engineers to hand-author rules or maintain thresholds,
  alongside declaratively configured validation checks. The platform covers structured, semi-structured
  and unstructured data, performs root-cause analysis on failed checks, tracks table lineage, and routes
  alerts to Slack, Microsoft Teams, Jira, ServiceNow, PagerDuty and email. Anomalo exposes a REST
  Public API (`/api/public/v1/`) for warehouse connection, table configuration, check authoring and
  execution, check-run results, labels, lineage edges, users, API keys and access-group administration,
  plus a first-party Python client and CLI, an Apache Airflow provider, and an official MCP server
  shipped as a Google Gemini CLI extension. Anomalo is deployed per-tenant, with API documentation
  gated to customers; the company holds SOC 2 Type 2 and ISO 27001 attestations.
