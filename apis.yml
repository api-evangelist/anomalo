        url: https://www.anomalo.com/product-overview/
  - name: Anomalo MCP Server
    description: >-
      Official Anomalo MCP (Model Context Protocol) server, published by Anomalo as a Google Gemini CLI
      extension under the Apache-2.0 license. Runs locally over stdio against a customer's own Anomalo
      instance, exposing tools for listing organizations and labels, browsing configured tables, reading
      table data profiles and data quality check status, listing configured checks, triggering check runs
      and polling check-run results. Authenticated with `ANOMALO_INSTANCE_HOST` and
      `ANOMALO_API_SECRET_TOKEN`.
    humanURL: https://github.com/datagravity-ai/anomalo-gemini-extension
    baseURL: https://github.com/datagravity-ai/anomalo-gemini-extension
