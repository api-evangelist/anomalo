note: >-
  Binds each tool published by Anomalo's official MCP server to the REST operation(s) that back it.
  Confidence is high throughout because the MCP server's own source calls the first-party Python client
  by method name, and that client's `_api_call()` invocations are what both OpenAPI descriptions were
  derived from — so the binding is read from code on both ends rather than matched by name. Anomalo
  exposes no GraphQL surface. The dominant pattern here is FAN-IN: several MCP tools are server-side
  composites that stitch together multiple REST calls, which is why tool count (11) is far below
  operation count (100).
