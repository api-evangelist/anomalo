observations:
  - >-
    The MCP surface is a deliberate 17% projection of the REST surface, and the cut is coherent: read
    the state of data quality, and trigger a check run. Every mutating capability except triggering a
    run — warehouses, access groups, users, API keys, check authoring, table configuration, labels,
    lineage edges, notification channels — is withheld.
  - >-
    The one write tool carries a guardrail the REST API does not: a client-side 15-minute per-table
    throttle on full-table check runs, enforced in the MCP server process. This is agent-safety
    engineering living in the tool layer rather than the API layer.
  - >-
    Lineage read operations are the clearest gap. An agent asked to explain a failed check has the check
    results but no upstream/downstream context, despite four lineage operations existing in REST.
